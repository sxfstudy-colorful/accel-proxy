node:
  id: relay-transit-01

relay:
  tunnel:
    listen_addr: ":9000"
    tls:
      enabled: true
      cert_file: /etc/accel-proxy/tls/relay.crt
      key_file:  /etc/accel-proxy/tls/relay.key
  services:
    - id: web-service-a
      routes:
        - idc: idc-beijing
          groups:
            - name: primary
              hops:
                - type: ip
                  addr: 10.1.0.1
                  port: 9100
                  host: egress-bj-01.internal
                  tls: true
            - name: backup
              priority: -1
              hops:
                - type: domain
                  addr: egress-bj-backup.internal
                  port: 9100
                  tls: true

log:
  level: info
  format: json
