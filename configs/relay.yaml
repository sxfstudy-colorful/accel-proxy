node:
  type: relay
  id: relay-transit-01

services:
  - id: web-service-a
    routes:
      - idc: idc-beijing
        groups:
          - name: primary
            hops:
              - type: ip
                addr: 10.1.0.1
                port: 9100
                host: egress-bj-01.internal
                tls: true
              - type: ip
                addr: 10.1.0.2
                port: 9100
                host: egress-bj-02.internal
                tls: true
          - name: backup
            priority: -1
            hops:
              - type: domain
                addr: egress-bj-backup.internal
                port: 9100
                tls: true
      - idc: idc-hongkong
        groups:
          - hops:
              - type: domain
                addr: egress-hk-01.internal
                port: 9100
                tls: true

  - id: db-service-b
    routes:
      - idc: idc-beijing
        groups:
          - hops:
              - type: ip
                addr: 10.1.0.1
                port: 9100
                host: egress-bj-01.internal
                tls: true

tunnel:
  listen_addr: ":9000"
  path: /tunnel
  read_timeout: 60s
  write_timeout: 60s
  max_frame_size: 65536
  tls:
    enabled: true
    cert_file: /etc/accel-proxy/tls/relay.crt
    key_file:  /etc/accel-proxy/tls/relay.key

log:
  level: info
  format: json
