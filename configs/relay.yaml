node:
  type: relay
  id: relay-transit-01

services:
  - id: web-service-a
    routes:                      # relay 需要 idc 键区分多个目标机房
      - idc: idc-beijing
        groups:
          - name: primary
            hops:
              - ip: 10.1.0.1
                port: 9100
                host: egress-bj-01.internal
              - ip: 10.1.0.2
                port: 9100
                host: egress-bj-02.internal
          - name: backup
            priority: -1
            hops:
              - ip: 10.1.0.9
                port: 9100
                host: egress-bj-backup.internal
      - idc: idc-hongkong
        groups:
          - hops:
              - ip: 10.2.0.1
                port: 9100
                host: egress-hk-01.internal

  - id: db-service-b
    routes:
      - idc: idc-beijing
        groups:
          - hops:
              - ip: 10.1.0.1
                port: 9100
                host: egress-bj-01.internal

tunnel:
  listen_addr: ":9000"
  path: /tunnel
  read_timeout: 60s
  write_timeout: 60s
  max_frame_size: 65536
  tls:
    enabled: false

log:
  level: info
  format: json
