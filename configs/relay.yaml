# ─────────────────────────────────────────────────────────────────────────────
# Relay Node Configuration  (中间代理节点)
#
# Topology:
#   AccessNode ──► RelayNode (this) ──► EgressNode ──► Origin
# ─────────────────────────────────────────────────────────────────────────────

node:
  type: relay
  id: relay-node-01

# Relay 节点同样需要 services 配置，用于在收到隧道后选择下一跳
services:
  - id: web-service-a
    port: 0              # relay 不直接监听业务端口，port 字段忽略
    protocol: http
    origin:
      host: backend-a.internal
      port: 80
    # 下一跳：转发到 Egress 节点
    next_hops:
      - ws://egress-01.internal:9100/tunnel
      - ws://egress-02.internal:9100/tunnel

  - id: db-service-b
    port: 0
    protocol: tcp
    origin:
      host: db.internal
      port: 5432
    next_hops:
      - ws://egress-01.internal:9100/tunnel

  - id: api-service-c
    port: 0
    protocol: https
    origin:
      host: api.internal
      port: 443
    next_hops:
      - ws://egress-01.internal:9100/tunnel

# 内部隧道监听地址（接受来自 Access 节点的 WS 连接）
tunnel:
  listen_addr: ":9000"
  path: /tunnel
  read_timeout: 60s
  write_timeout: 60s
  max_frame_size: 65536

  # 启用 TLS 保护内部隧道（推荐生产环境开启）
  tls:
    enabled: false
    cert_file: /etc/accel-proxy/certs/relay.crt
    key_file:  /etc/accel-proxy/certs/relay.key

log:
  level: info
  format: json
