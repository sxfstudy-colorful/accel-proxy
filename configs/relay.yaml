node:
  type: relay
  id: relay-transit-01

services:
  - id: web-service-a
    routes:
      idc-beijing:
        - ip: 10.1.0.1          # 直接 IP，不依赖 DNS
          port: 9100
          host: egress-bj-01.internal
        - ip: 10.1.0.2
          port: 9100
          host: egress-bj-02.internal

  - id: db-service-b
    routes:
      idc-beijing:
        - ip: 10.1.0.1
          port: 9100
          host: egress-bj-01.internal

  - id: api-service-c
    routes:
      idc-hongkong:
        - ip: 10.2.0.1
          port: 9000
          host: relay-hk-01.internal
          tls: true

tunnel:
  listen_addr: ":9000"
  path: /tunnel
  read_timeout: 60s
  write_timeout: 60s
  max_frame_size: 65536
  tls:
    enabled: false

log:
  level: info
  format: json
