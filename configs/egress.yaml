node:
  id: egress-beijing-01
  idc: idc-beijing

egress:
  tunnel:
    listen_addr: ":9100"
    tls:
      enabled: true
      cert_file: /etc/accel-proxy/tls/egress.crt
      key_file:  /etc/accel-proxy/tls/egress.key
  services:
    - id: web-service-a
      origin:
        host: backend-svc.internal
        port: 80

log:
  level: info
  format: json
