# ─────────────────────────────────────────────────────────────────────────────
# Egress Node  (中心机房，负责回源)
#
# 拓扑：
#   RelayNode ──► EgressNode(this) ──► Origin Server
#
# 路由逻辑：
#   收到隧道 → 校验 TargetIDC == node.idc（防路由错误）
#            → 按 ServiceID 查本地 origin 地址
#            → 拨连源站
#
# 源站地址只在 Egress 本地配置，不通过任何网络协议传递。
# ─────────────────────────────────────────────────────────────────────────────

node:
  type: egress
  id: egress-beijing-01
  idc: idc-beijing

services:
  - id: web-service-a
    origin:
      host: backend-a.bj.internal
      port: 80
      tls: false
      dial_timeout: 10s

  - id: db-service-b
    origin:
      host: db-master.bj.internal
      port: 5432
      dial_timeout: 5s

tunnel:
  listen_addr: ":9100"
  path: /tunnel
  read_timeout: 60s
  write_timeout: 60s
  max_frame_size: 65536
  tls:
    enabled: false
    cert_file: /etc/accel-proxy/certs/egress.crt
    key_file:  /etc/accel-proxy/certs/egress.key

log:
  level: info
  format: json
