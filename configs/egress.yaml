# ─────────────────────────────────────────────────────────────────────────────
# Egress Node  (中心机房，负责回源)
#
# 拓扑：
#   RelayNode ──► EgressNode(this) ──► Origin Server
#
# 路由逻辑：
#   收到隧道 → 校验 TargetIDC == node.idc（防路由错误）
#            → 按 ServiceID 查本地 origin 地址
#            → 拨连源站
#
# 源站地址只在 Egress 本地配置，不通过任何网络协议传递。
# ─────────────────────────────────────────────────────────────────────────────

node:
  type: egress
  id: egress-beijing-01
  idc: idc-beijing          # 必填：本节点所在机房，用于校验 TargetIDC

services:
  # ── 业务 A：本机房内的 HTTP 源站地址 ───────────────────────────────────────
  - id: web-service-a
    origin:
      host: backend-a.bj.internal   # 北京机房内的源站
      port: 80
      tls: false
      dial_timeout: 10s

  # ── 业务 B：本机房内的数据库 ───────────────────────────────────────────────
  - id: db-service-b
    origin:
      host: db-master.bj.internal
      port: 5432
      dial_timeout: 5s

  # ── 业务 C：本机房不承载（api-service-c 的 target_idc = idc-hongkong）
  #            香港机房的 egress 节点才需要配置此 service
  # - id: api-service-c
  #   origin:
  #     host: api.hk.internal
  #     port: 443
  #     tls: true

tunnel:
  listen_addr: ":9100"
  path: /tunnel
  read_timeout: 60s
  write_timeout: 60s
  max_frame_size: 65536
  tls:
    enabled: false
    cert_file: /etc/accel-proxy/certs/egress.crt
    key_file:  /etc/accel-proxy/certs/egress.key

log:
  level: info
  format: json
