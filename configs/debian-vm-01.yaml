node:
  id: mixed-node-01
  idc: mixed-node-01

access:
  max_frame_size: 65536
  services:
    - id: http-service-001
      port: 8080
      protocol: http
      target_idc: idc-beijing
      groups:
        - name: primary
          hops:
            - type: ip
              addr: 192.168.1.201
              port: 9000
              host: relay-mixed-node-01.internal
              tls: false
        - name: backup
          priority: -1
          hops:
            - type: ip
              addr: 192.168.1.202
              port: 9000
              host: relay-mixed-node-02.internal
              tls: false

relay:
  tunnel:
    listen_addr: ":9000"
  services:
    - id: http-service-001
      routes:
        - idc: idc-beijing
          groups:
            - name: primary
              hops:
                - type: ip
                  addr: 192.168.1.202
                  port: 9000
                  host: relay-mixed-node-02.internal
                  tls: false
            - name: backup
              priority: -1
              hops:
                - type: ip
                  addr: 192.168.1.203
                  port: 9000
                  host: relay-mixed-node-03.internal
                  tls: false

log:
  level: info
  format: text
