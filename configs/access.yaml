node:
  type: access
  id: access-shanghai-01

services:
  - id: web-service-a
    port: 8080
    protocol: http
    target_idc: idc-beijing      # 路由目标 IDC，groups 无需重复声明
    groups:
      - name: primary
        hops:
          - host: relay-bj-01.internal
            port: 9000
          - ip: 10.0.1.6
            port: 9000
            host: relay-bj-02.internal
      - name: backup
        priority: -1             # 仅在 primary 全部失联时使用
        hops:
          - ip: 10.0.1.9
            port: 9000
            host: relay-bj-backup.internal
    http:
      rewrite_host: true
      add_request_headers:
        X-Proxy-Service: "web-service-a"

  - id: db-service-b
    port: 5432
    protocol: tcp
    target_idc: idc-beijing
    groups:
      - hops:
          - ip: 10.0.1.5
            port: 9000
            host: relay-bj-01.internal

tunnel:
  path: /tunnel
  max_frame_size: 65536

log:
  level: info
  format: text
