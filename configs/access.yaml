node:
  type: access
  id: access-shanghai-01

services:
  # ── 业务 A：HTTP，源站在北京机房 ──────────────────────────────────────────
  - id: web-service-a
    port: 8080
    protocol: http
    target_idc: idc-beijing

    routes:
      idc-beijing:
        # 有固定域名的节点（标准配置）
        - host: relay-bj-01.internal
          port: 9000
          tls: false
        # 无域名的边缘节点，直接用 IP 拨连，host 仅用于 TLS SNI / 日志
        - ip: 10.0.1.6
          port: 9000
          host: relay-bj-02.internal  # TLS SNI；无 TLS 时仅用于日志
          tls: false

    http:
      rewrite_host: true
      add_request_headers:
        X-Proxy-Service: "web-service-a"

  # ── 业务 B：TCP，源站在北京机房 ──────────────────────────────────────────
  - id: db-service-b
    port: 5432
    protocol: tcp
    target_idc: idc-beijing
    routes:
      idc-beijing:
        - ip: 10.0.1.5
          port: 9000
          host: relay-bj-01.internal

  # ── 业务 C：HTTPS，源站在香港机房 ──────────────────────────────────────
  - id: api-service-c
    port: 8443
    protocol: https
    target_idc: idc-hongkong
    routes:
      idc-hongkong:
        - ip: 10.0.2.10
          port: 9000
          host: relay-hk-01.internal
          tls: true
          tunnel_path: /tunnel
        - ip: 10.0.2.11
          port: 9000
          host: relay-hk-02.internal
          tls: true

tunnel:
  path: /tunnel
  max_frame_size: 65536

log:
  level: info
  format: text
